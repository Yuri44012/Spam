<!DOCTYPE html>
<html>
<head>
  <title>Roblox Group Wall Poster</title>
  <style>
    body { font-family: sans-serif; padding: 30px; background: #f9f9f9; }
    .container { max-width: 400px; margin: auto; padding: 20px; background: white; border-radius: 10px; }
    textarea, input, button { width: 100%; margin-top: 10px; padding: 10px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Post to Group Wall</h2>

    <input id="cookie" placeholder="Paste your .ROBLOSECURITY cookie" />

    <div id="login">
      <button onclick="checkLogin()">Login</button>
    </div>

    <div id="form" style="display:none;">
      <p>Logged in as: <span id="username"></span></p>
      
      <input id="groupUrl" placeholder="Enter Roblox group URL (e.g., https://www.roblox.com/groups/123456789/Group-Name)" />
      
      <textarea id="message" placeholder="Type your message"></textarea>
      <button onclick="postMessage()">Post</button>
      <p id="status"></p>
    </div>
  </div>

  <script>
    let userId = null;
    let cookie = "";

    async function checkLogin() {
      cookie = document.getElementById("cookie").value.trim();
      if (!cookie) return alert("Please enter your cookie!");

      const res = await fetch('/user', {
        headers: { Authorization: cookie }
      });

      const data = await res.json();
      if (data.error) return alert("Login failed");

      userId = data.id;
      document.getElementById("username").innerText = data.name;
      document.getElementById("login").style.display = "none";
      document.getElementById("form").style.display = "block";
    }

    async function postMessage() {
      const groupUrl = document.getElementById("groupUrl").value.trim();
      const message = document.getElementById("message").value;

      if (!groupUrl || !message) return alert("Please enter a group URL and message.");

      // Extract group ID from the URL
      const groupId = groupUrl.split('/')[4]; // Extract group ID from URL (e.g., https://www.roblox.com/groups/123456789/Group-Name)

      const res = await fetch('/post', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: cookie
        },
        body: JSON.stringify({ groupId, message })
      });

      const data = await res.json();
      document.getElementById("status").innerText = data.success ? "Posted!" : "Error: " + data.error;
    }
  </script>
</body>
</html>
